name: Build Raylan Module AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Unzip project & clean extra files
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d project_src
          else
            mkdir -p project_src
            cp -r * project_src/ 2>/dev/null || true
          fi
          find project_src -name "google-services.json" -delete
          find project_src -name "secrets.properties" -delete
          find project_src -name "debug.keystore" -delete

      - name: Build Debug APK
        run: |
          SETTINGS_FILE=$(find project_src -name "settings.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raylan-Module-AI-Debug
          path: project_src/**/app/build/outputs/apk/debug/*.apk
          
